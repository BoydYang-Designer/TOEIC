<!DOCTYPE html>
<html lang="zh-Hant" class="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOEIC Daily Coach</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-200">
<div class="max-w-4xl mx-auto p-4 md:p-8">
  <header class="flex items-start justify-between gap-3 mb-6 md:mb-10">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold">TOEIC Daily Coach</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">選擇要練習的題型</p>
    </div>
    <button id="dk" onclick="toggleDark()" class="rounded-lg px-4 py-2 text-sm font-medium border border-slate-300 dark:border-slate-700 cursor-pointer shrink-0" aria-label="切換深淺色"></button>
  </header>

  <main id="grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4"></main>

  <details id="lk" class="mt-8 md:mt-12 rounded-xl border border-slate-200 dark:border-slate-800 bg-white/60 dark:bg-slate-900/60 p-3 md:p-4">
    <summary class="cursor-pointer font-bold text-base md:text-lg select-none">🔖 網址紀錄 <span class="text-sm font-normal text-slate-500 dark:text-slate-400">網站・影片・備註</span> <span id="lkn" class="text-sm font-normal text-slate-500 dark:text-slate-400"></span></summary>
    <div class="mt-3 space-y-2">
      <div class="flex gap-2">
        <input id="lku" type="url" inputmode="url" autocomplete="off" placeholder="貼上網址（https://…）" class="flex-1 min-w-0 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 text-sm">
        <button id="lkp" type="button" class="rounded-lg px-3 py-2 text-sm border border-slate-300 dark:border-slate-700 shrink-0">貼上</button>
      </div>
      <textarea id="lkt" rows="2" placeholder="備註（選填）：為什麼收藏、重點是什麼" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 text-sm"></textarea>
      <div class="flex flex-wrap items-center gap-2">
        <button id="lka" type="button" class="rounded-lg px-4 py-2 text-sm font-medium bg-indigo-600 text-white">新增紀錄</button>
        <input id="lkq" type="search" placeholder="搜尋網址或備註" class="flex-1 min-w-[8rem] rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 text-sm">
        <button id="lkc" type="button" class="rounded-lg px-3 py-2 text-sm border border-slate-300 dark:border-slate-700 shrink-0">複製全部</button>
      </div>
      <div id="lkl" class="space-y-2 pt-1"></div>
      <p class="text-xs text-slate-400">紀錄存在這個瀏覽器（localStorage）；點右下角「☁ 登入同步」用 Google 登入後，手機與電腦會共用同一份紀錄。整合內容時按「複製全部」即可貼出。</p>
    </div>
  </details>

  <details id="vk" class="mt-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-white/60 dark:bg-slate-900/60 p-3 md:p-4">
    <summary class="cursor-pointer font-bold text-base md:text-lg select-none">📝 單字紀錄 <span class="text-sm font-normal text-slate-500 dark:text-slate-400">生字・意思・例句</span> <span id="vkn" class="text-sm font-normal text-slate-500 dark:text-slate-400"></span></summary>
    <div class="mt-3 space-y-2">
      <input id="vkw" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="單字或片語（例如 negotiate）" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 text-sm">
      <textarea id="vkm" rows="2" placeholder="意思／例句／備註（選填）" class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 text-sm"></textarea>
      <div class="flex flex-wrap items-center gap-2">
        <button id="vka" type="button" class="rounded-lg px-4 py-2 text-sm font-medium bg-indigo-600 text-white">新增單字</button>
        <input id="vkq" type="search" placeholder="搜尋單字或備註" class="flex-1 min-w-[8rem] rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 text-sm">
        <button id="vkc" type="button" class="rounded-lg px-3 py-2 text-sm border border-slate-300 dark:border-slate-700 shrink-0">複製全部</button>
      </div>
      <div id="vkl" class="space-y-2 pt-1"></div>
      <p class="text-xs text-slate-400">單字存在這個瀏覽器（localStorage）。整合內容時按「複製全部」即可貼出。</p>
    </div>
  </details>

  <details id="mt" class="mt-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-white/60 dark:bg-slate-900/60 p-3 md:p-4">
    <summary class="cursor-pointer font-bold text-base md:text-lg select-none">🔧 維護總覽 <span class="text-sm font-normal text-slate-500 dark:text-slate-400">音檔・Timing 狀態</span> <span id="mtb" class="ml-1 text-xs font-normal"></span></summary>
    <div id="mtc" class="mt-3"></div>
    <a href="map.html" class="mt-4 flex items-center gap-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3 text-sm font-bold hover:bg-slate-50 dark:hover:bg-slate-800">🗺 專案地圖 <span class="text-xs font-normal text-slate-500 dark:text-slate-400">頁面・資料・py 關聯（自動掃描）</span><span class="ml-auto text-slate-400">→</span></a>
  </details>
</div>

<script src="cloud-sync.js"></script>
<script src="timing.js"></script>
<script>
const KEY = 'toeicCoachV2'; // 與 Daily practice 共用，深淺色設定會同步
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}

const ITEMS = [
  { icon: '📅', title: 'Daily practice', sub: '每日一篇 · 單字 · 隨堂測驗', href: 'daily.html' },
  { icon: '📚', title: 'TSL 單字總表', sub: 'New TOEIC Service List 1250 字 · 看還缺哪些', href: 'vocab.html' },
  { tag: 'Part 1', icon: '📷', title: '照片描述', en: 'Photographs', sub: '分組模擬 · 陷阱分析', href: 'part1.html' },
  { tag: 'Part 2', icon: '💬', title: '應答問題', en: 'Question-Response', sub: '題型分類 · 陷阱分析', href: 'part2.html' },
  { tag: 'Part 3', icon: '🗣️', title: '簡短對話', en: 'Conversations', sub: '兩人／三人對話 · 圖表題', href: 'part3.html' },
  { tag: 'Part 4', icon: '🎤', title: '簡短獨白', en: 'Talks', sub: '獨白類型 · 預讀題目 · 圖表題', href: 'part4.html' },
  { tag: 'Part 5', icon: '✏️', title: '句子填空', en: 'Incomplete Sentences', sub: '12 選 4 輪替 · 句子音檔 · 考點分類', href: 'part5.html' },
  { tag: 'Part 6', icon: '📝', title: '段落填空', en: 'Text Completion', sub: '4 篇 × 4 題 · 句子插入 · 文章音檔', href: 'part6.html' },
  { tag: 'Part 7', icon: '📖', title: '閱讀理解', en: 'Reading Comprehension', sub: '單篇／雙篇／三篇 · 整合題 · 文件音檔', href: 'part7.html' }
];

const base = 'rounded-xl border p-4 md:p-5 flex items-center gap-4 ';
document.getElementById('grid').innerHTML = ITEMS.map(x => {
  const inner = `
    <div class="text-3xl shrink-0 w-12 h-12 flex items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-800">${x.icon}</div>
    <div class="flex-1 min-w-0">
      ${x.tag ? `<div class="text-xs text-slate-400 font-semibold">${x.tag}</div>` : ''}
      <div class="font-bold text-base md:text-lg leading-tight">${x.title}${x.en ? ` <span class="text-sm font-normal text-slate-500 dark:text-slate-400">${x.en}</span>` : ''}</div>
      ${x.sub ? `<div class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">${x.sub}</div>` : ''}
    </div>`;
  return x.href
    ? `<a href="${x.href}" class="${base} border-indigo-400 bg-white dark:bg-slate-900 ring-1 ring-indigo-300 dark:ring-indigo-800 hover:bg-indigo-50 dark:hover:bg-indigo-950 transition">${inner}<span class="text-indigo-600 dark:text-indigo-400 text-xl shrink-0">→</span></a>`
    : `<div class="${base} border-slate-200 dark:border-slate-800 bg-white/60 dark:bg-slate-900/60 opacity-60 cursor-not-allowed" aria-disabled="true">${inner}<span class="text-xs rounded-full px-2.5 py-1 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 shrink-0">即將推出</span></div>`;
}).join('');

function paint() {
  document.documentElement.classList.toggle('dark', !!S.dark);
  document.getElementById('dk').textContent = S.dark ? '☀ 淺色' : '☾ 深色';
}
function toggleDark() {
  S.dark = !S.dark;
  try { // 只更新 dark，保留既有的作答紀錄
    const cur = JSON.parse(localStorage.getItem(KEY) || '{}');
    cur.dark = S.dark; localStorage.setItem(KEY, JSON.stringify(cur));
  } catch (e) {}
  paint();
}

/* ===== 維護總覽：讀 audio/index.json（Scan總表與音檔.py 產生） ===== */
const MT = [
  ['daily', '📅', 'Daily practice', 'daily.html'], ['p1', '📷', 'Part 1', 'part1.html'], ['p2', '💬', 'Part 2', 'part2.html'],
  ['p3', '🗣️', 'Part 3', 'part3.html'], ['p4', '🎤', 'Part 4', 'part4.html'], ['p5', '✏️', 'Part 5', 'part5.html'], ['p6', '📝', 'Part 6', 'part6.html'], ['p7', '📖', 'Part 7', 'part7.html']
];
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function mtRow(I, k, icon, label, href, tmx) {
  const d = I[k] || {}, t = d.total, c = (d.complete || []).length, pn = Object.keys(d.partial || {}).length, o = (d.orphans || []).length;
  const head = `<a href="${href}" class="font-bold hover:underline">${icon} ${label}</a>`;
  const mb = `<a href="${href}#admin" class="text-xs rounded-lg px-2.5 py-1 border border-indigo-400 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-950 shrink-0">🛠 維護</a>`;
  if (typeof t !== 'number') return `<div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3 md:p-4"><div class="flex justify-between gap-2">${head}<span class="flex items-center gap-2"><span class="text-xs text-slate-500">無資料，請重新執行 Scan總表與音檔.py</span>${mb}</span></div></div>`;
  const none = Math.max(0, t - c - pn), pct = t ? Math.round(c / t * 100) : 0, ok = t > 0 && c === t && !o && (!tmx || tmx.ok === tmx.total);
  const badge = ok ? '<span class="text-xs rounded-full px-2 py-0.5 bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300">✔ 完整</span>'
    : '<span class="text-xs rounded-full px-2 py-0.5 bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300">⚠ 待補</span>';
  const pl = Object.entries(d.partial || {}).map(([id, m]) => `<div><code>${esc(id)}</code> 缺 ${m.length} 個：${esc(m.join('、'))}</div>`).join('');
  const ol = (d.orphans || []).map(f => `<div><code>${esc(f)}</code></div>`).join('');
  const detail = (pl || ol) ? `<details class="mt-2 text-xs text-slate-600 dark:text-slate-400"><summary class="cursor-pointer">看明細</summary>${pl ? `<div class="mt-1 font-semibold">部分缺漏</div>${pl}` : ''}${ol ? `<div class="mt-1 font-semibold">孤兒檔（檔名可能打錯）</div>${ol}` : ''}</details>` : '';
  return `<div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3 md:p-4">
    <div class="flex items-center justify-between gap-2">${head}<span class="flex items-center gap-2">${badge}${mb}</span></div>
    <div class="h-2 rounded-full bg-slate-100 dark:bg-slate-800 mt-2 overflow-hidden"><div class="h-full bg-emerald-500" style="width:${pct}%"></div></div>
    <div class="text-xs text-slate-500 dark:text-slate-400 mt-1.5">共 ${t} ${esc(d.unit || '題')} · 完整 ${c} · 部分 ${pn} · 無音檔 ${none} · 孤兒檔 ${o}</div>${detail}${tmx ? mtTiming(tmx) : ''}</div>`;
}
/* Daily 的 timing 狀態：讀 daily.json，用 timing.js 的 tmInfo 判斷（與 daily.html 維護頁同一套標準） */
function mtTimingData(D) {
  const items = Array.isArray(D) ? D : (D && Array.isArray(D.items) ? D.items : null);
  if (!items) return null;
  const r = { total: items.length, ok: 0, partial: 0, bad: 0, none: 0, todo: [] };
  items.forEach(x => {
    const s = tmInfo(x).state; r[s]++;
    if (s !== 'ok') r.todo.push({ id: `w${x.week}d${x.day}`, tag: x.tag || '', s, why: tmWhy(x) });
  });
  return r;
}
function mtTiming(r) {
  const pct = r.total ? Math.round(r.ok / r.total * 100) : 0, done = r.ok === r.total;
  const list = r.todo.length ? `<details class="mt-2 text-xs text-slate-600 dark:text-slate-400"><summary class="cursor-pointer">看 timing 明細（${r.todo.length} 篇未完成）</summary>${r.todo.map(t => `<div class="py-0.5"><code>${esc(t.id)}</code> ${TM_LABEL[t.s]}${t.why && t.why !== TM_LABEL[t.s] ? '（' + esc(t.why) + '）' : ''} <span class="text-slate-400">${esc(t.tag)}</span></div>`).join('')}</details>` : '';
  return `<div class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-800">
    <div class="flex items-center justify-between gap-2"><span class="text-sm font-semibold">⏱ Timing（句子時間戳記）</span>${done ? '<span class="text-xs rounded-full px-2 py-0.5 bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300">✔ 完整</span>' : '<span class="text-xs rounded-full px-2 py-0.5 bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300">⚠ 待補</span>'}</div>
    <div class="h-2 rounded-full bg-slate-100 dark:bg-slate-800 mt-2 overflow-hidden"><div class="h-full bg-emerald-500" style="width:${pct}%"></div></div>
    <div class="text-xs text-slate-500 dark:text-slate-400 mt-1.5">共 ${r.total} 篇 · 完成 ${r.ok} · 部分 ${r.partial} · 異常 ${r.bad} · 未做 ${r.none}</div>${list}</div>`;
}
/* TSL 單字詳解：讀 vocab_index.json（Scan總表與音檔.py 產生；每個字 [週, 天, 詳解狀態]，狀態 0＝已入庫但缺詳解） */
function tslGapOf(V) { return V && V.tsl ? Object.entries(V.tsl).filter(([k, v]) => v[2] === 0) : []; }
function mtTsl(V) {
  const wrap = b => `<div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3 md:p-4">${b}</div>`;
  const head = '<a href="vocab.html" class="font-bold hover:underline">📚 TSL 單字詳解</a>';
  const mb = '<a href="daily.html#tsl" class="text-xs rounded-lg px-2.5 py-1 border border-indigo-400 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-950 shrink-0">🛠 去生成</a>';
  if (!V || !V.tsl) return wrap(`<div class="flex justify-between gap-2">${head}<span class="text-xs text-slate-500">無資料，請重新執行 Scan總表與音檔.py</span></div>`);
  const ents = Object.entries(V.tsl);
  if (!ents.some(([k, v]) => v.length > 2)) return wrap(`<div class="flex justify-between gap-2">${head}<span class="text-xs text-slate-500">尚無詳解狀態，請重新執行 Scan總表與音檔.py</span></div>`);
  const gap = tslGapOf(V).sort((a, b) => a[1][0] - b[1][0] || a[1][1] - b[1][1] || a[0].localeCompare(b[0])), have = ents.length, ok = have - gap.length, pct = have ? Math.round(ok / have * 100) : 0;
  const badge = gap.length ? '<span class="text-xs rounded-full px-2 py-0.5 bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300">⚠ 待補</span>' : '<span class="text-xs rounded-full px-2 py-0.5 bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300">✔ 完整</span>';
  const by = {}; gap.forEach(([k, v]) => { (by[`W${v[0]}·D${v[1]}`] = by[`W${v[0]}·D${v[1]}`] || []).push(k); });
  const list = gap.length ? `<details class="mt-2 text-xs text-slate-600 dark:text-slate-400"><summary class="cursor-pointer">看缺詳解的字（${gap.length}）</summary>${Object.entries(by).map(([k, ws]) => `<div class="py-0.5"><code>${k}</code> ${ws.map(w => `<a href="daily.html#vocab=${encodeURIComponent(w)}" class="underline">${esc(w)}</a>`).join('、')}</div>`).join('')}</details>` : '';
  return wrap(`<div class="flex items-center justify-between gap-2">${head}<span class="flex items-center gap-2">${badge}${mb}</span></div>
    <div class="h-2 rounded-full bg-slate-100 dark:bg-slate-800 mt-2 overflow-hidden"><div class="h-full bg-emerald-500" style="width:${pct}%"></div></div>
    <div class="text-xs text-slate-500 dark:text-slate-400 mt-1.5">已入庫 ${have} 字 · 有詳解 ${ok} · 缺詳解 ${gap.length}</div>${list}`);
}
async function mtLoad() {
  const box = document.getElementById('mtc'), tag = document.getElementById('mtb');
  const head = '';
  const getJ = async u => { try { const r = await fetch(u, { cache: 'no-store' }); if (!r.ok) return null; return await r.json(); } catch (e) { return null; } };
  try {
    const I0 = await getJ('audio/index.json');
    const D = (I0 && I0.timing) ? null : await getJ('daily.json');
    const V = await getJ('vocab_index.json'); // index.json 已含 timing 狀態就不必下載整份 daily.json
    if (!I0 && !D) throw 0;
    const I = I0 || {}, tmx = I.timing ? I.timing : (D ? mtTimingData(D) : null);
    const lt = Array.isArray(I.letters) ? I.letters : [];
    const when = I.v ? new Date(I.v * 1000).toLocaleString('zh-TW', { hour12: false }) : '—';
    const w = Array.isArray(I.warn) ? I.warn : [];
    const bad = MT.filter(m => { const d = I[m[0]] || {}; return !(d.total > 0 && (d.complete || []).length === d.total && !(d.orphans || []).length && (m[0] !== 'daily' || !tmx || tmx.ok === tmx.total)); }).length + (tslGapOf(V).length ? 1 : 0);
    tag.innerHTML = bad ? `<span class="rounded-full px-2 py-0.5 bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300">⚠ ${bad} 項待補</span>` : '<span class="rounded-full px-2 py-0.5 bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300">✔ 全部完整</span>';
    box.innerHTML = head
      + `<p class="text-xs text-slate-500 dark:text-slate-400 mb-3">最後掃描：${when} · 選項字母 ${'ABCDE'.split('').map(c => `<span class="${lt.includes(c) ? 'text-emerald-600' : 'text-rose-500'}">${c}${lt.includes(c) ? '✔' : '✖'}</span>`).join(' ')}（Part 1 需 A–D，Part 2 需 A–C）</p>`
      + `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${MT.map(m => mtRow(I, ...m, m[0] === 'daily' ? tmx : null)).join('')}${mtTsl(V)}</div>`
      + (w.length ? `<details class="mt-3 rounded-xl border border-amber-300 dark:border-amber-800 bg-amber-50 dark:bg-amber-950/30 p-3 text-xs"><summary class="cursor-pointer font-semibold">⚠ 掃描警告 ${w.length} 則</summary><ul class="mt-2 space-y-1 list-disc pl-4">${w.map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>` : '')
      + (I0 ? '' : '<p class="text-xs text-amber-600 mt-3">讀不到 audio/index.json，音檔狀態無法顯示（請執行 Scan總表與音檔.py）。</p>')
      + (tmx ? '' : '<p class="text-xs text-amber-600 mt-3">讀不到 timing 狀態（audio/index.json 沒有 timing 區塊，也讀不到 daily.json）。</p>')
      + (I.timing || !D ? '' : '<p class="text-xs text-slate-400 mt-3">Timing 是即時讀取整份 daily.json 算出來的；重新執行 Scan總表與音檔.py 後會改讀 audio/index.json（流量較小）。</p>')
      + '<p class="text-xs text-slate-400 mt-3">音檔資料來自 audio/index.json（新增或搬動音檔後請重新執行 Scan總表與音檔.py 並上傳）；Timing 狀態也由 Scan總表與音檔.py 算好寫在同一個 index.json（執行後一起上傳）；若 index.json 沒有 timing 區塊才會退回讀 daily.json。</p>';
  } catch (e) {
    box.innerHTML = head + '<p class="text-sm text-slate-500 dark:text-slate-400">讀不到 audio/index.json 與 daily.json（尚未掃描，或以 file:// 直接開啟）。請從網站網址開啟（VS Code Go Live 即可）。</p>';
  }
}
/* 記住展開狀態（同一分頁內）；從各 Part 維護頁返回時（index.html#mt）自動展開並捲到總覽 */
(function () {
  const d = document.getElementById('mt');
  let on = false; try { on = sessionStorage.getItem('mtOpen') === '1'; } catch (e) {}
  if (location.hash === '#mt') on = true;
  if (on) { d.open = true; if (location.hash === '#mt') setTimeout(() => d.scrollIntoView({ block: 'start' }), 0); }
  d.addEventListener('toggle', () => { try { sessionStorage.setItem('mtOpen', d.open ? '1' : '0'); } catch (e) {} });
})();
/* ===== 網址紀錄：存 localStorage（鍵 toeicLinksV1，獨立於作答紀錄） ===== */
(function () {
  const LK = 'toeicLinksV1';
  let L = [];
  try { L = JSON.parse(localStorage.getItem(LK) || '[]'); if (!Array.isArray(L)) L = []; } catch (e) { L = []; }
  const opened = new Set(); let editing = null, q = '';
  const $ = id => document.getElementById(id);
  const save = () => { try { localStorage.setItem(LK, JSON.stringify(L)); } catch (e) { alert('儲存失敗（瀏覽器空間不足或無痕模式）'); } };
  const norm = u => { u = u.trim(); if (u && !/^[a-z][a-z0-9+.-]*:\/\//i.test(u) && /^\S+\.\S+$/.test(u)) u = 'https://' + u; return u; };
  const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } };
  const safe = u => /^https?:\/\//i.test(u);
  const icon = u => /youtu\.?be|bilibili|vimeo|tiktok|instagram|twitch/i.test(host(u)) ? '🎬' : '🔗';
  const fmt = t => new Date(t).toLocaleDateString('zh-TW');
  const inp = 'w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 text-sm';
  const btn = 'rounded-lg px-3 py-1.5 text-xs border border-slate-300 dark:border-slate-700';
  async function copy(txt) {
    try { await navigator.clipboard.writeText(txt); return true; } catch (e) {}
    const a = document.createElement('textarea'); a.value = txt; a.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(a); a.select(); let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {} a.remove(); return ok;
  }
  function render() {
    const kw = q.trim().toLowerCase();
    const list = L.filter(x => !kw || (x.url + ' ' + x.note).toLowerCase().includes(kw));
    $('lkn').textContent = L.length ? '（' + L.length + '）' : '';
    if (!list.length) { $('lkl').innerHTML = `<p class="text-sm text-slate-500 dark:text-slate-400 py-2">${L.length ? '沒有符合的紀錄。' : '還沒有紀錄。貼上網址、寫下備註後按「新增紀錄」。'}</p>`; return; }
    $('lkl').innerHTML = list.map(x => {
      if (editing === x.id) return `<div class="rounded-xl border border-indigo-400 bg-white dark:bg-slate-900 p-3 space-y-2" data-id="${x.id}">
        <input class="${inp}" data-f="url" value="${esc(x.url)}" inputmode="url">
        <textarea class="${inp}" data-f="note" rows="3" placeholder="備註">${esc(x.note)}</textarea>
        <div class="flex gap-2"><button type="button" data-act="save" class="rounded-lg px-3 py-1.5 text-xs bg-indigo-600 text-white">儲存</button><button type="button" data-act="cancel" class="${btn}">取消</button></div></div>`;
      const link = safe(x.url) ? `<a href="${esc(x.url)}" target="_blank" rel="noopener" class="text-indigo-600 dark:text-indigo-400 underline break-all text-sm">${esc(x.url)}</a>` : `<span class="break-all text-sm">${esc(x.url)}</span>`;
      return `<details data-id="${x.id}" ${opened.has(x.id) ? 'open' : ''} class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3">
        <summary class="cursor-pointer select-none"><span class="font-semibold text-sm">${icon(x.url)} ${esc(host(x.url))}</span> <span class="text-xs text-slate-400">${fmt(x.t)}</span>${x.note ? `<div class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 truncate">${esc(x.note.split('\n')[0])}</div>` : ''}</summary>
        <div class="mt-2 space-y-2">${link}${x.note ? `<p class="text-sm whitespace-pre-wrap break-words">${esc(x.note)}</p>` : '<p class="text-xs text-slate-400">（沒有備註）</p>'}
        <div class="flex flex-wrap gap-2"><button type="button" data-act="edit" class="${btn}">✎ 編輯</button><button type="button" data-act="copy" class="${btn}">複製網址</button><button type="button" data-act="del" class="${btn} text-rose-600 dark:text-rose-400">🗑 刪除</button></div></div></details>`;
    }).join('');
  }
  function add() {
    const u = norm($('lku').value), n = $('lkt').value.trim();
    if (!u) { $('lku').focus(); return; }
    if (L.some(x => x.url === u) && !confirm('這個網址已經記錄過了，還要再新增一筆嗎？')) return;
    const id = 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    L.unshift({ id, url: u, note: n, t: Date.now() }); save();
    $('lku').value = ''; $('lkt').value = ''; opened.add(id); render();
  }
  $('lka').onclick = add;
  $('lku').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
  $('lkq').addEventListener('input', e => { q = e.target.value; render(); });
  $('lkp').onclick = async () => {
    try { const t = await navigator.clipboard.readText(); if (t) $('lku').value = t.trim(); } catch (e) { $('lku').focus(); alert('瀏覽器不允許讀取剪貼簿，請長按輸入框手動貼上。'); }
  };
  $('lkc').onclick = async e => {
    if (!L.length) return;
    const txt = L.map((x, i) => (i + 1) + '. ' + x.url + (x.note ? '\n   備註：' + x.note.replace(/\n/g, '\n   ') : '')).join('\n');
    const ok = await copy(txt), b = e.target, o = b.textContent; b.textContent = ok ? '已複製 ✔' : '複製失敗'; setTimeout(() => b.textContent = o, 1500);
  };
  $('lkl').addEventListener('toggle', e => { const id = e.target.dataset && e.target.dataset.id; if (id) e.target.open ? opened.add(id) : opened.delete(id); }, true);
  $('lkl').addEventListener('click', async e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const row = b.closest('[data-id]'), id = row.dataset.id, x = L.find(v => v.id === id); if (!x) return;
    const act = b.dataset.act;
    if (act === 'edit') { editing = id; render(); }
    else if (act === 'cancel') { editing = null; render(); }
    else if (act === 'save') {
      const u = norm(row.querySelector('[data-f=url]').value);
      if (!u) return;
      x.url = u; x.note = row.querySelector('[data-f=note]').value.trim(); editing = null; save(); render();
    }
    else if (act === 'del') { if (confirm('刪除這筆紀錄？')) { L = L.filter(v => v.id !== id); opened.delete(id); save(); render(); } }
    else if (act === 'copy') { const ok = await copy(x.url); const o = b.textContent; b.textContent = ok ? '已複製 ✔' : '複製失敗'; setTimeout(() => b.textContent = o, 1500); }
  });
  render();
})();
/* ===== 單字紀錄：存 localStorage（鍵 toeicVocabV1，獨立於網址紀錄與作答紀錄） ===== */
(function () {
  const VK = 'toeicVocabV1';
  let L = [];
  try { L = JSON.parse(localStorage.getItem(VK) || '[]'); if (!Array.isArray(L)) L = []; } catch (e) { L = []; }
  const opened = new Set(); let editing = null, q = '';
  const $ = id => document.getElementById(id);
  const save = () => { try { localStorage.setItem(VK, JSON.stringify(L)); } catch (e) { alert('儲存失敗（瀏覽器空間不足或無痕模式）'); } };
  const fmt = t => new Date(t).toLocaleDateString('zh-TW');
  const inp = 'w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 text-sm';
  const btn = 'rounded-lg px-3 py-1.5 text-xs border border-slate-300 dark:border-slate-700';
  async function copy(txt) {
    try { await navigator.clipboard.writeText(txt); return true; } catch (e) {}
    const a = document.createElement('textarea'); a.value = txt; a.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(a); a.select(); let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {} a.remove(); return ok;
  }
  function render() {

    const list = L.filter(x => !kw || (x.word + ' ' + x.note).toLowerCase().includes(kw));
    $('vkn').textContent = L.length ? '（' + L.length + '）' : '';
    if (!list.length) { $('vkl').innerHTML = `<p class="text-sm text-slate-500 dark:text-slate-400 py-2">${L.length ? '沒有符合的單字。' : '還沒有單字。輸入單字與意思後按「新增單字」。'}</p>`; return; }
    $('vkl').innerHTML = list.map(x => {
      if (editing === x.id) return `<div class="rounded-xl border border-indigo-400 bg-white dark:bg-slate-900 p-3 space-y-2" data-id="${x.id}">
        <input class="${inp}" data-f="word" value="${esc(x.word)}" autocapitalize="off" spellcheck="false">
        <textarea class="${inp}" data-f="note" rows="3" placeholder="意思／例句／備註">${esc(x.note)}</textarea>
        <div class="flex gap-2"><button type="button" data-act="save" class="rounded-lg px-3 py-1.5 text-xs bg-indigo-600 text-white">儲存</button><button type="button" data-act="cancel" class="${btn}">取消</button></div></div>`;
      return `<details data-id="${x.id}" ${opened.has(x.id) ? 'open' : ''} class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3">
        <summary class="cursor-pointer select-none"><span class="font-semibold text-sm">${esc(x.word)}</span> <span class="text-xs text-slate-400">${fmt(x.t)}</span>${x.note ? `<div class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 truncate">${esc(x.note.split('\n')[0])}</div>` : ''}</summary>
        <div class="mt-2 space-y-2">${x.note ? `<p class="text-sm whitespace-pre-wrap break-words">${esc(x.note)}</p>` : '<p class="text-xs text-slate-400">（沒有備註）</p>'}
        <div class="flex flex-wrap gap-2"><button type="button" data-act="edit" class="${btn}">✎ 編輯</button><button type="button" data-act="copy" class="${btn}">複製單字</button><button type="button" data-act="del" class="${btn} text-rose-600 dark:text-rose-400">🗑 刪除</button></div></div></details>`;
    }).join('');
  }
  function add() {
    const w = $('vkw').value.trim(), n = $('vkm').value.trim();

    L.unshift({ id, word: w, note: n, t: Date.now() }); save();
    $('vkw').value = ''; $('vkm').value = ''; opened.add(id); render(); $('vkw').focus();
  }
  $('vka').onclick = add;
  $('vkw').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
  $('vkq').addEventListener('input', e => { q = e.target.value; render(); });
  $('vkc').onclick = async e => {
    if (!L.length) return;
    const txt = L.map((x, i) => (i + 1) + '. ' + x.word + (x.note ? '\n   ' + x.note.replace(/\n/g, '\n   ') : '')).join('\n');
    const ok = await copy(txt), b = e.target, o = b.textContent; b.textContent = ok ? '已複製 ✔' : '複製失敗'; setTimeout(() => b.textContent = o, 1500);

  $('vkl').addEventListener('toggle', e => { const id = e.target.dataset && e.target.dataset.id; if (id) e.target.open ? opened.add(id) : opened.delete(id); }, true);

    const b = e.target.closest('[data-act]'); if (!b) return;

    if (act === 'edit') { editing = id; render(); }
    else if (act === 'cancel') { editing = null; render(); }
    else if (act === 'save') {
      const w = row.querySelector('[data-f=word]').value.trim();
      if (!w) return;
      x.word = w; x.note = row.querySelector('[data-f=note]').value.trim(); editing = null; save(); render();
    }
    else if (act === 'del') { if (confirm('刪除這個單字？')) { L = L.filter(v => v.id !== id); opened.delete(id); save(); render(); } }
    else if (act === 'copy') { const ok = await copy(x.word); const o = b.textContent; b.textContent = ok ? '已複製 ✔' : '複製失敗'; setTimeout(() => b.textContent = o, 1500); }
  });
  render();
})();
